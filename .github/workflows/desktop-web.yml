name: Eden's Garden desktop builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop-web/**'
      - '.github/workflows/desktop-web.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-web/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop-web
        run: npm ci
      - name: Check source
        working-directory: desktop-web
        run: npm run check
      - name: Build unsigned Windows installer
        working-directory: desktop-web
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Garden-Windows-unsigned
          path: desktop-web/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-web/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop-web
        run: npm ci
      - name: Check source
        working-directory: desktop-web
        run: npm run check
      - name: Build unsigned Mac apps
        working-directory: desktop-web
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Eden-Garden-Mac-unsigned
          path: desktop-web/dist/*.dmg
          if-no-files-found: error
          retention-days: 7
