name: Build Eden OS ISO

on:
  workflow_dispatch:
    inputs:
      boot_smoke:
        description: 'Run optional headless QEMU BIOS smoke check'
        type: boolean
        required: true
        default: false
      require_branding:
        description: 'Require logo and all six wallpapers (recommended)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: eden-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check artwork before building
        shell: bash
        env:
          REQUIRE_BRANDING: ${{ inputs.require_branding }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRE_BRANDING" == true ]]; then
            test -s edenos-artwork/logo/edenos-logo.png || { echo 'EdenOS logo missing. Upload EdenOS_Artwork_Pack.zip contents first.' >&2; exit 1; }
            count=$(find edenos-artwork/wallpapers -maxdepth 1 -type f -name '*.png' | wc -l)
            [[ "$count" -eq 6 ]] || { echo "Expected 6 wallpapers, found $count" >&2; exit 1; }
            echo 'EdenOS branding assets present.'
          else
            echo 'WARNING: Unbranded development image allowed.'
          fi

      - name: Run source tests
        run: PYTHONPATH=eden-shell python3 -m unittest discover -s eden-shell/tests -v

      - name: Build in Debian 13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          docker run --rm --privileged \
            --env EDEN_SOURCE_COMMIT="${{ github.sha }}" \
            --env EDEN_PACKAGE_VERSION="0.1.0~dev${{ github.run_id }}+g${{ github.sha }}" \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie \
            bash scripts/build-iso 2>&1 | tee output/build.log

      - name: Validate ISO structure and checksum
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xorriso mtools squashfs-tools
          cd output
          sha256sum --check eden-os-amd64-test.iso.sha256
          test -s eden-os-amd64-test.iso
          xorriso -indev eden-os-amd64-test.iso -ls /live 2>&1 | tee iso-live-files.txt
          grep -q 'filesystem.squashfs' iso-live-files.txt
          xorriso -indev eden-os-amd64-test.iso -report_el_torito plain 2>&1 | tee iso-boot-catalog.txt
          xorriso -osirrox on -indev eden-os-amd64-test.iso -extract /boot/grub/efi.img efi.img
          mcopy -i efi.img ::/EFI/BOOT/BOOTX64.EFI BOOTX64.EFI
          PYTHONPATH=../eden-shell python3 -m eden_shell.iso_checks iso-boot-catalog.txt BOOTX64.EFI
          rm -f efi.img BOOTX64.EFI
          xorriso -osirrox on -indev eden-os-amd64-test.iso -extract /live/filesystem.squashfs find-eden-filesystem.squashfs
          python3 ../scripts/verify-find-eden-iso find-eden-filesystem.squashfs
          rm -f find-eden-filesystem.squashfs

      - name: Verify branding inside finished ISO
        if: ${{ inputs.require_branding }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq squashfs-tools
          mkdir -p output/iso-inspection
          xorriso -osirrox on -indev output/eden-os-amd64-test.iso \
            -extract /live/filesystem.squashfs output/iso-inspection/filesystem.squashfs
          unsquashfs -ll output/iso-inspection/filesystem.squashfs > output/iso-inspection/files.txt
          grep -Fq 'usr/share/pixmaps/edenos-logo.png' output/iso-inspection/files.txt
          for name in 01-eden-sunrise 02-eden-waterfalls 03-eden-rainbow 04-eden-moonlight 05-eden-butterflies 06-eden-orchard; do
            grep -Fq "usr/share/backgrounds/edenos/$name.png" output/iso-inspection/files.txt
          done
          grep -Fq 'etc/lightdm/lightdm-gtk-greeter.conf.d/50-edenos.conf' output/iso-inspection/files.txt
          echo 'Verified EdenOS logo, six wallpapers, and login theme inside ISO.'
          rm -f output/iso-inspection/filesystem.squashfs

      - name: BIOS and UEFI boot diagnostics
        if: ${{ inputs.boot_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq qemu-system-x86 ovmf
          bash scripts/boot-smoke output/eden-os-amd64-test.iso output/qemu-bios-smoke.log
          bash scripts/boot-smoke output/eden-os-amd64-test.iso output/qemu-uefi-smoke.log uefi

      - name: Save test ISO and checksum
        uses: actions/upload-artifact@v6
        with:
          name: eden-os-test-iso-${{ github.run_number }}
          path: |
            output/eden-os-amd64-test.iso
            output/eden-os-amd64-test.iso.sha256
            output/build-info.txt
            output/eden-os-desktop_*.deb
            output/eden-os-update.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eden-os-build-log-${{ github.run_number }}
          path: |
            output/build.log
            output/qemu-bios-smoke.log
            output/qemu-uefi-smoke.log
          if-no-files-found: ignore
          retention-days: 7


