name: Build Eden OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eden-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run source tests
        run: PYTHONPATH=eden-shell python3 -m unittest discover -s eden-shell/tests -v

      - name: Build in Debian 13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie \
            bash scripts/build-iso 2>&1 | tee output/build.log

      - name: Save test ISO and checksum
        uses: actions/upload-artifact@v6
        with:
          name: eden-os-test-iso-${{ github.run_number }}
          path: |
            output/eden-os-amd64-test.iso
            output/eden-os-amd64-test.iso.sha256
            output/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eden-os-build-log-${{ github.run_number }}
          path: output/build.log
          if-no-files-found: ignore
          retention-days: 7
