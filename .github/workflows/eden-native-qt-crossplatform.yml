name: Eden Native Staging - Windows and macOS (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: windows-x64
          - os: macos-15-intel
            name: macos-intel
          - os: macos-26
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native-apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt and build tools
        shell: bash
        run: python -m pip install 'PySide6>=6.8,<7' 'PySide6-Addons>=6.8,<7' 'pyinstaller>=6,<7'
      - name: Run native tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -q
      - name: Build unsigned preview
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --name EdenNativeStaging --collect-submodules eden_native.approved_models --hidden-import secrets --add-data 'assets:assets' --add-data 'eden_native/approved_models/parent_pin.py:eden_native/approved_models' launch_native.py
      - name: Upload unsigned preview
        uses: actions/upload-artifact@v4
        with:
          name: EdenNativeStaging-${{ matrix.name }}
          path: native-apps/dist/EdenNativeStaging*
          if-no-files-found: error
